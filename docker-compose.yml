# Production-style deployment. Set the variables in a .env file next to this compose file.
services:
  storage-io:
    # Published image. To run a local build instead: `docker build -t storage-io:local .`
    # and set STORAGE_IO_IMAGE=storage-io:local.
    image: ${STORAGE_IO_IMAGE:-kianfar/storage-io:latest}
    restart: unless-stopped
    ports:
      - "${STORAGE_IO_PORT:-3000}:3000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET (>= 32 chars)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Off unless a reverse proxy really sits in front of this container. See
      # apps/api/.env.example: a trusted hop that is not there lets any client
      # forge its own IP address. `1` for one proxy, or a list of proxy CIDRs.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TZ: ${TZ:-UTC}
    volumes:
      - storage-io-data:/data
volumes:
  storage-io-data:
