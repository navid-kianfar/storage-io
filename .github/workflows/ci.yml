name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @storage-io/contracts build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
  integration:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: docker compose -f docker/docker-compose.dev.yml up -d --wait
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @storage-io/contracts build
      - run: S3_IT=1 pnpm --filter @storage-io/api test
  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t storage-io:ci .
