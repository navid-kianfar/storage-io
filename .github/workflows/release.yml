name: release

# Fires only on a version tag someone pushed deliberately. Nothing here runs on
# a branch push, so a release is always a human action.
on:
  push:
    tags: ['v*']

# Two tags pushed close together are two different releases; cancelling one
# would leave a tag with no image. So: never cancel, just serialise.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  IMAGE: kianfar/storage-io

jobs:
  # The same gate as ci.yml's `verify`. A tag can be pushed to any commit, so
  # this is not a duplicate of the branch run — it is the check that *this*
  # commit is releasable.
  verify:
    name: lint, typecheck, unit + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @storage-io/contracts build
      - run: pnpm lint
      # See the note in ci.yml: `pnpm format:check` joins both workflows once
      # the tree has been formatted once.
      - run: pnpm typecheck
      - run: pnpm test

      # A tag that disagrees with package.json produces an image whose
      # `/health` reports a different version from its own tag. Catch it here,
      # before anything is published.
      - name: Tag matches package.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "version $pkg"

  # One native runner per platform (no QEMU): each pushes its image by digest,
  # then `image` stitches the digests into one multi-arch manifest list.
  build:
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Repository secrets on this repo, same names as the other kianfar images.
      # DOCKERHUB_TOKEN should be a Docker Hub access token with read/write scope.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=storage-io
            org.opencontainers.image.description=Self-hosted web console for S3-compatible object storage (MinIO, SeaweedFS, AWS S3, Ceph RGW, Garage, R2, Wasabi).
            org.opencontainers.image.source=https://github.com/navid-kianfar/storage-io
            org.opencontainers.image.url=https://github.com/navid-kianfar/storage-io
            org.opencontainers.image.licenses=MIT

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    name: multi-arch manifest → Docker Hub
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` is requested explicitly: `latest=auto` does not fire on a tag
      # event, and pre-release tags (v0.2.0-rc.1) must never become the default.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

      # Non-fatal on purpose: updating the repository description needs a token
      # with more than push scope, and a release must not fail over the blurb.
      - name: Sync the Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: 'One console for all your S3-compatible storage (MinIO, SeaweedFS, AWS S3, Ceph, Garage, R2, Wasabi).'
          readme-filepath: ./README.md

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          set -euo pipefail
          # YAML strips this block's own indentation, so the heredoc body reaches
          # the shell flush left — which it has to be, because an indented ```
          # fence is not a fence and the snippet would render as prose.
          cat > /tmp/notes.md <<EOF
          ### Install

          \`\`\`bash
          docker run -d --name storage-io \\
            -p 3000:3000 \\
            -v storage-io-data:/data \\
            -e ADMIN_USERNAME=admin \\
            -e ADMIN_PASSWORD='<a long password>' \\
            -e APP_SECRET='<32+ random characters>' \\
            ${IMAGE}:${VERSION}
          \`\`\`

          Then open <http://localhost:3000>.

          \`APP_SECRET\` encrypts every stored storage-server secret: keep it, back it
          up, and never change it on a live installation — every saved server would
          have to be entered again.

          Images: \`${IMAGE}:${VERSION}\`, \`${IMAGE}:latest\` — \`linux/amd64\` and \`linux/arm64\`.
          EOF
          # `--notes` (not `--notes-file`) is the flag gh documents as prepending
          # to `--generate-notes`, so the snippet lands above the changelog.
          gh release create "$GITHUB_REF_NAME" \
            --title "storage-io $GITHUB_REF_NAME" \
            --notes "$(cat /tmp/notes.md)" \
            --generate-notes \
            --verify-tag
