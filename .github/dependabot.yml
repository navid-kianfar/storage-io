version: 2

updates:
  # One grouped PR a week per ecosystem beats forty single-dependency PRs that
  # each need a full CI run. Majors stay separate: they are the ones that need
  # reading, and a group containing one is a group nobody can review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # pnpm's own version is pinned by `packageManager` in package.json and by
      # corepack in the Dockerfile; bumping it is a deliberate change, not a
      # dependency update.
      - dependency-name: pnpm
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    labels: ['dependencies']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
    labels: ['dependencies', 'ci']

  # The Dockerfile's `node:24-slim` base. The dev compose file's MinIO and
  # SeaweedFS tags are pinned on purpose (see the comments in it) and live under
  # docker/, which is not scanned here.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    commit-message:
      prefix: 'chore(docker)'
    labels: ['dependencies', 'docker']
